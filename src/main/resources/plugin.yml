
name: WOWManager
version: 1.0.0
main: com.wowmanager.WOWManager
api-version: '1.21'
author: WOWManager
description: SMP Management Plugin

commands:
  announcement:
    description: Broadcast an announcement
    usage: /announcement <message>
  setspawn:
    description: Set server spawn
  spawn:
    description: Teleport to spawn
  rank:
    description: Manage ranks
  scoreboard:
    description: Toggle scoreboard

permissions:
  wowmanager.admin:
    description: Access to admin commands
    default: op
  wowmanager.spawn.bypass:
    description: Bypass spawn teleport delay
    default: op
